
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Revision</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <h2>CSS Playground</h2>

    <p>
      Learn how CSS controls the way elements
      appear and behave on a webpage.
    </p>

    <div class="display-demo">
      <span class="block">Block</span>
      <span class="inline">Inline</span>
      <span class="inline-block">Inline-block</span>
    </div>

    <div class="hidden-demo">
      <span>First</span>
      <span class="invisible">Hidden</span>
      <span>Third</span>
    </div>

    <div class="overflow-box">
      CSS overflow controls what happens when
      content becomes larger than the space
      available inside its container.
      Keep adding content to see the effect.
    </div>

    <button class="action">Explore CSS</button>
  </main>

</body>
</html>
